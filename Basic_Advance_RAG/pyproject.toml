[project]
name = "basic-advance-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ravi-Nikam", email = "ravinikam0999@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
basic-advance-rag = "basic_advance_rag:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
